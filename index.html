<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Title</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <video autoplay muted loop id="bg-video">
        <source src="background.mp4" type="video/mp4">
    </video>
    <div class="overlay">
        <h1>Game Title</h1>
        <p>Experience the Adventure</p>
        <a href="#trailer" class="btn">Watch Trailer</a>
    </div>
</header>

<section id="trailer">
    <h2>Game Trailer</h2>
    <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe>
</section>

<section id="screenshots">
    <h2>Gallery</h2>
    <div class="gallery">
        <img src="screenshot1.jpg" alt="Screenshot 1">
        <img src="screenshot2.jpg" alt="Screenshot 2">
        <img src="screenshot3.jpg" alt="Screenshot 3">
    </div>
</section>

<section id="news">
    <h2>Latest News</h2>
    <article>
        <h3>Game Release Date Announced</h3>
        <p>We are excited to announce the official release date of our game! Stay tuned for more updates.</p>
    </article>
</section>

<footer>
    <p>&copy; 2025 Game Studio. All rights reserved.</p>
    <div class="social-links">
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
        <a href="#">YouTube</a>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
